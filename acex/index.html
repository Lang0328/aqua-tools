<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=desktop.html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua Tools · 正在进入桌面…</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { color-scheme: light; --primary: #5b6cff; --accent: #22d3ee; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: grid; place-items: center; color: #1c2233;
            background: linear-gradient(135deg, #eef1f8, #e7ecfb);
            overflow: hidden;
        }
        .splash {
            display: flex; flex-direction: column; align-items: center; gap: 18px;
            padding: 36px 44px; border-radius: 24px;
            background: rgba(255, 255, 255, 0.42);
            backdrop-filter: saturate(220%) blur(26px); -webkit-backdrop-filter: saturate(220%) blur(26px);
            border: 1px solid rgba(255, 255, 255, 0.75);
            box-shadow: inset 0 1.5px 1px rgba(255,255,255,0.92), inset -1.5px -1.5px 1.5px rgba(50,55,95,0.3), 0 10px 34px rgba(31,38,135,0.2);
        }
        .splash i { font-size: 30px; color: var(--primary); }
        .splash span { font-size: 14px; color: #4a5266; letter-spacing: .3px; }
        .ring {
            width: 30px; height: 30px; border-radius: 50%;
            border: 3px solid rgba(91,108,255,0.25); border-top-color: var(--primary);
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        a { color: var(--primary); text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>
    <div class="splash">
        <i class="fas fa-droplet"></i>
        <div class="ring"></div>
        <span>正在进入 Aqua 桌面…</span>
        <a href="desktop.html">未自动跳转？点此进入桌面</a>
    </div>
    <script>
        // 优先用 JS 跳转（避免 meta refresh 在某些环境被拦截）
        location.replace('desktop.html');
    </script>
</body>
</html>
